# =============================================================================
# Santaane Platform Web - Development Environment
# =============================================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml build
#   docker-compose -f docker-compose.dev.yml up
#
# Prerequisites:
#   - Backend must be running (./santaane dev in santaane-plateform-api/)
#   - Backend creates the network: santaane-plateform-api_default
# =============================================================================

services:
  web:
    build:
      context: .
      target: development
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}

    container_name: santaane_web_dev
    user: root
    restart: unless-stopped

    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      # Enable polling for Docker volume watching (hot reload)
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

    ports:
      - "3000:3000"
    volumes:
      # Code source en lecture seule (c'est ok)
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      
      # Retirez le :ro sur ces fichiers de configuration
      - ./middleware.ts:/app/middleware.ts
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json

      # Volumes anonymes pour isoler les dossiers de build et dépendances
      - /app/node_modules
      - /app/.next
    # Connect to backend network
    networks:
      - santaane_network

    labels:
      - dev.environment=development
      - dev.hot-reload=enabled

# External network created by backend
networks:
  santaane_network:
    external: true
    name: santaane-plateform-api_default
